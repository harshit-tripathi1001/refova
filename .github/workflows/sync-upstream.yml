name: Sync Fork with Upstream

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "aditya-yadav1176/refova"
          source_branch: "main"
          destination_branch: "main"
